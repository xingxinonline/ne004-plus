# S300 QSPI Flash 烧录配置
# OpenOCD配置文件，用于通过JTAG/SWD直接烧录RBL到QSPI Flash

# 调试器配置 (根据实际使用的调试器修改)
# 对于ST-Link V2/V3
source [find interface/stlink.cfg]

# 对于J-Link
# source [find interface/jlink.cfg]

# 对于DAPLink
# source [find interface/cmsis-dap.cfg]

# 目标芯片配置 (Cortex-M4)
set CHIPNAME s300
set CPUTAPID 0x4ba00477

# SWD传输配置
transport select swd

# 创建TAP
swd newdap $CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $CPUTAPID

# 创建target
target create $CHIPNAME.cpu cortex_m -chain-position $CHIPNAME.cpu

# 工作区域配置 (使用SRAM)
$CHIPNAME.cpu configure -work-area-phys 0x80000000 -work-area-size 0x40000 -work-area-backup 0

# 复位配置
reset_config srst_only srst_nogate

# QSPI Flash配置
# 这里配置QSPI Flash为W25Q128 (16MB)
set QSPI_BASE 0x40012000

# Flash bank配置 (这是一个模板，实际需要根据S300的QSPI实现)
# flash bank <name> <driver> <base> <size> <chip_width> <bus_width> <target>
# 对于QSPI Flash，我们需要实现自定义的烧录函数

# 初始化函数
proc s300_qspi_init {} {
    global QSPI_BASE
    
    echo "初始化S300 QSPI控制器..."
    
    # 使能时钟 (需要根据S300的RCC寄存器实现)
    # 这里的地址需要根据S300实际的RCC寄存器地址
    # mww 0x40021000 0x00000001  # 假设的RCC使能寄存器
    
    # 配置QSPI控制器寄存器
    # 具体寄存器值需要参考S300的QSPI控制器规格
    mww [expr $QSPI_BASE + 0x00] 0x00000083  # 配置寄存器
    mww [expr $QSPI_BASE + 0x04] 0x00000000  # 设备指令寄存器
    mww [expr $QSPI_BASE + 0x08] 0x00FFFFFF  # 设备大小寄存器 (16MB)
    
    echo "QSPI控制器初始化完成"
}

# 读取Flash ID
proc s300_flash_read_id {} {
    global QSPI_BASE
    
    echo "读取Flash ID..."
    
    # 发送读ID命令 (0x9F)
    mww [expr $QSPI_BASE + 0x90] 0x8000009F  # 命令寄存器
    
    # 等待命令完成
    sleep 10
    
    # 读取ID数据
    set id_low [mrw [expr $QSPI_BASE + 0xA0]]
    set id_high [mrw [expr $QSPI_BASE + 0xA4]]
    
    set flash_id [expr ($id_low & 0xFFFFFF)]
    echo [format "Flash ID: 0x%06X" $flash_id]
    
    # 验证W25Q128 ID (0xEF4018)
    if {$flash_id == 0xEF4018} {
        echo "✅ 检测到W25Q128 Flash"
        return 1
    } else {
        echo "❌ Flash ID不匹配"
        return 0
    }
}

# 禁用Flash写保护
proc s300_flash_disable_wp {} {
    global QSPI_BASE
    
    echo "禁用Flash写保护..."
    
    # 写使能命令 (0x06)
    mww [expr $QSPI_BASE + 0x90] 0x80000006
    sleep 10
    
    # 写状态寄存器命令 (0x01) - 清除保护位
    mww [expr $QSPI_BASE + 0xA8] 0x00000000  # 状态寄存器值：清除所有保护
    mww [expr $QSPI_BASE + 0x90] 0x80100001  # 命令+1字节数据
    sleep 100
    
    echo "Flash写保护已禁用"
}

# 启用Flash写保护
proc s300_flash_enable_wp {} {
    global QSPI_BASE
    
    echo "启用Flash写保护..."
    
    # 写使能命令
    mww [expr $QSPI_BASE + 0x90] 0x80000006
    sleep 10
    
    # 设置保护状态 - 保护前64KB (RBL区域)
    mww [expr $QSPI_BASE + 0xA8] 0x00000024  # BP0=1, TB=1
    mww [expr $QSPI_BASE + 0x90] 0x80100001
    sleep 100
    
    echo "Flash写保护已启用 (保护RBL区域)"
}

# 擦除Flash扇区
proc s300_flash_sector_erase {addr} {
    global QSPI_BASE
    
    echo [format "擦除Flash扇区: 0x%06X" $addr]
    
    # 写使能
    mww [expr $QSPI_BASE + 0x90] 0x80000006
    sleep 10
    
    # 扇区擦除命令 (0x20)
    mww [expr $QSPI_BASE + 0x94] $addr
    mww [expr $QSPI_BASE + 0x90] 0x80080020  # 命令+地址
    
    # 等待擦除完成
    sleep 1000
    echo [format "扇区擦除完成: 0x%06X" $addr]
}

# 烧录RBL文件
proc s300_program_rbl {filename} {
    echo "🚀 开始烧录RBL: $filename"
    
    # 初始化QSPI
    s300_qspi_init
    
    # 读取Flash ID
    if {![s300_flash_read_id]} {
        echo "❌ Flash检测失败"
        return
    }
    
    # 禁用写保护
    s300_flash_disable_wp
    
    # 擦除RBL区域 (0x00000 - 0x0FFFF, 16个4KB扇区)
    for {set i 0} {$i < 16} {incr i} {
        s300_flash_sector_erase [expr $i * 0x1000]
    }
    
    echo "开始写入RBL数据..."
    
    # 使用OpenOCD的load_image命令烧录二进制文件
    # 注意：这需要实现自定义的QSPI Flash驱动或使用memory map
    # 这里提供一个简化的实现思路
    
    # 如果QSPI支持XIP模式，可以直接写入到XIP地址
    # load_image $filename 0x80000000 bin
    
    # 或者分块读取文件并通过QSPI命令写入
    echo "⚠️  实际烧录需要实现详细的QSPI页编程逻辑"
    echo "   可以使用'load_image'命令配合自定义Flash驱动"
    
    # 启用写保护
    s300_flash_enable_wp
    
    echo "🎉 RBL烧录完成!"
}

# 显示Flash信息
proc s300_flash_info {} {
    echo "📊 S300 Flash信息:"
    
    s300_qspi_init
    s300_flash_read_id
    
    # 读取Flash状态寄存器
    global QSPI_BASE
    mww [expr $QSPI_BASE + 0x90] 0x80800005  # 读状态寄存器1
    sleep 10
    set status1 [mrw [expr $QSPI_BASE + 0xA0]]
    
    echo [format "Flash状态寄存器1: 0x%02X" [expr $status1 & 0xFF]]
    
    set busy [expr ($status1 & 0x01)]
    set wel [expr ($status1 & 0x02) >> 1]
    set bp [expr ($status1 & 0x1C) >> 2]
    
    echo "  BUSY: $busy, WEL: $wel, BP: $bp"
}

# 快捷命令定义
proc rbl_info {} {
    s300_flash_info
}

proc rbl_program {filename} {
    s300_program_rbl $filename
}

proc rbl_disable_wp {} {
    s300_qspi_init
    s300_flash_disable_wp
}

proc rbl_enable_wp {} {
    s300_qspi_init  
    s300_flash_enable_wp
}

# 初始化提示
echo "=========================================="
echo "S300 RBL Flash 烧录工具已加载"
echo "可用命令:"
echo "  rbl_info            - 显示Flash信息"
echo "  rbl_program <file>  - 烧录RBL文件"
echo "  rbl_disable_wp      - 禁用写保护"
echo "  rbl_enable_wp       - 启用写保护"
echo "=========================================="
